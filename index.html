<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Música Club</title>
  <meta name="application-name" content="Música Club">
  <meta name="apple-mobile-web-app-title" content="Música Club">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#eaf7ff">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
  <link rel="apple-touch-icon" sizes="167x167" href="./icon-167.png">
  <link rel="apple-touch-icon" sizes="152x152" href="./icon-152.png">
  <link rel="apple-touch-icon" sizes="120x120" href="./icon-120.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
  <style>
:root{
  color-scheme: light;
  --app-bg:#eaf7ff;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-right:env(safe-area-inset-right,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-left:env(safe-area-inset-left,0px);
}
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  min-width:100%;
  min-height:100%;
  background:var(--app-bg);
  overflow:hidden;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans Thai",sans-serif;
  position:fixed;
  inset:0;
  width:100%;
  height:100dvh;
  min-height:100dvh;
}
#app-frame{
  position:fixed;
  top:var(--safe-top);
  right:var(--safe-right);
  bottom:var(--safe-bottom);
  left:var(--safe-left);
  width:auto;
  height:auto;
  min-width:0;
  min-height:0;
  margin:0;
  padding:0;
  border:0;
  overflow:hidden;
  background:var(--app-bg);
}
#app-frame iframe{
  display:block;
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  min-width:100%;
  min-height:100%;
  margin:0;
  padding:0;
  border:0;
}
</style>
</head>
<body>
  <div id="app-frame">
    <div id="loading">
      <img src="./logo.png" alt="Música Club">
      <div>กำลังเปิด Música Club...</div>
    </div>
    <div id="app-frame"><iframe id="musica-app" src="https://script.google.com/macros/s/AKfycbyq97v3iT0XBSzTS46ade3ckf3dn_f03dJ6XEGEYIDodJlvrk1ECzjixPxQxT_z_6Yz/exec" title="Música Club" allow="fullscreen; clipboard-read; clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
  </div>
  <script>
    const frame=document.getElementById('musica-app');
    const loading=document.getElementById('loading');
    frame.addEventListener('load',()=>setTimeout(()=>loading.classList.add('hidden'),250));
    setTimeout(()=>loading.classList.add('hidden'),10000);
  </script>
</body>
</html>
