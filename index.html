<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Música Club</title>

  <meta name="application-name" content="Música Club">
  <meta name="apple-mobile-web-app-title" content="Música Club">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
  <link rel="apple-touch-icon" sizes="167x167" href="./icon-167.png">
  <link rel="apple-touch-icon" sizes="152x152" href="./icon-152.png">
  <link rel="apple-touch-icon" sizes="120x120" href="./icon-120.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">

  <style>
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans Thai", sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
    }
    .launch {
      width: min(88vw, 360px);
      text-align: center;
    }
    .logo {
      width: min(58vw, 240px);
      height: auto;
      display: block;
      margin: 0 auto 28px;
    }
    .open-btn {
      appearance: none;
      border: 0;
      border-radius: 16px;
      padding: 14px 24px;
      font-size: 16px;
      font-weight: 600;
      background: #fff;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
      cursor: pointer;
    }
    .open-btn:active {
      transform: scale(.98);
    }
    .text {
      margin-top: 14px;
      font-size: 15px;
      color: #777;
    }
  </style>
</head>
<body>
  <main class="launch" aria-label="Música Club">
    <img class="logo" src="./icon-512.png" alt="Música Club">
    <button class="open-btn" type="button" onclick="openApp()">เข้าสู่ระบบ Música Club</button>
    <div class="text">กดปุ่มเพื่อเข้าสู่ระบบ</div>
  </main>

  <script>
    const APP_URL = "https://script.google.com/macros/s/AKfycbyq97v3iT0XBSzTS46ade3ckf3dn_f03dJ6XEGEYIDodJlvrk1ECzjixPxQxT_z_6Yz/exec";
    // In normal Safari, stay on this GitHub Pages launcher so it can be
    // added to the Home Screen with the Música Club icon.
    // When launched as an installed web app, open the real Apps Script app.
    function openApp() {
      window.location.replace(APP_URL);
    }

    const isInstalled =
      window.matchMedia("(display-mode: standalone)").matches ||
      window.navigator.standalone === true;

    if (isInstalled) {
      setTimeout(openApp, 300);
    }
  </script>
</body>
</html>
