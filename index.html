<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Música Club</title>
  <meta name="application-name" content="Música Club">
  <meta name="apple-mobile-web-app-title" content="Música Club">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#eaf7ff">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
  <link rel="apple-touch-icon" sizes="167x167" href="./icon-167.png">
  <link rel="apple-touch-icon" sizes="152x152" href="./icon-152.png">
  <link rel="apple-touch-icon" sizes="120x120" href="./icon-120.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
  <style>
:root{
  color-scheme:light;
  --app-bg:#eaf7ff;
}
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  min-width:100%;
  min-height:100%;
  background:var(--app-bg);
  overflow:hidden;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans Thai",sans-serif;
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  height:100dvh;
  min-height:100dvh;
}
#app-shell{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  height:100dvh;
  min-width:100vw;
  min-height:100vh;
  min-height:100dvh;
  margin:0;
  padding:0;
  border:0;
  overflow:hidden;
  background:var(--app-bg);
}
#musica-app{
  display:block;
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  min-width:100%;
  min-height:100%;
  margin:0;
  padding:0;
  border:0;
  overflow:hidden;
  background:var(--app-bg);
}
#loading{
  position:absolute;
  z-index:10;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:18px;
  background:var(--app-bg);
  transition:opacity .18s ease,visibility .18s ease;
}
#loading img{
  display:block;
  width:min(72vw,360px);
  height:auto;
  max-height:45vh;
  object-fit:contain;
}
#loading div{
  font-size:15px;
  color:#6f8794;
}
#loading.hidden{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}
@media (prefers-reduced-motion:reduce){
  #loading{transition:none}
}
</style>
</head>
<body>
  <div id="app-shell">
    <div id="loading" aria-hidden="true">
      <img src="./logo.png" alt="Música Club">
      <div>กำลังเปิด Música Club...</div>
    </div>
    <iframe id="musica-app"
      src="https://script.google.com/macros/s/AKfycbyq97v3iT0XBSzTS46ade3ckf3dn_f03dJ6XEGEYIDodJlvrk1ECzjixPxQxT_z_6Yz/exec"
      title="Música Club"
      allow="fullscreen; clipboard-read; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </div>
  <script>
    const frame = document.getElementById('musica-app');
    const loading = document.getElementById('loading');
    frame.addEventListener('load', () => {
      setTimeout(() => loading.classList.add('hidden'), 180);
    });
    setTimeout(() => loading.classList.add('hidden'), 10000);
  </script>
</body>
</html>
